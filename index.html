<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: #0a0a0a;
            color: #333;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            animation: fadeIn 3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #glitch-text {
            font-size: 2rem;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.5; }
            100% { opacity: 0.1; transform: scale(1.05); }
        }

        .scare {
            color: #800000 !important;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
        }

        #start-btn {
            background: transparent;
            color: #444;
            border: 1px solid #444;
            padding: 15px 30px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }

        #start-btn:hover {
            color: #800000;
            border-color: #800000;
            text-shadow: 0 0 5px #ff0000;
        }
    </style>
</head>
<body>

    <button id="start-btn">BEGIN</button>
    <div id="glitch-text">ARE YOU ALONE?</div>
    
    <div id="player" style="display:none;"></div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        const btn = document.getElementById('start-btn');
        const textElement = document.getElementById('glitch-text');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'olL0XFoPRZk',
                playerVars: { 
                    'autoplay': 0, 
                    'loop': 1, 
                    'playlist': 'olL0XFoPRZk',
                    'enablejsapi': 1 
                }
            });
        }

        function triggerGlitch() {
            const delay = Math.random() * 5000 + 2000;
            setTimeout(() => {
                textElement.classList.add('scare');
                textElement.innerText = "IT IS BEHIND YOU.";
                setTimeout(() => {
                    textElement.classList.remove('scare');
                    textElement.innerText = "ARE YOU ALONE?";
                    triggerGlitch();
                }, 200);
            }, delay);
        }

        btn.addEventListener('click', () => {
            btn.style.display = 'none';
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
            triggerGlitch();
        });
    </script>
</body>
</html>
